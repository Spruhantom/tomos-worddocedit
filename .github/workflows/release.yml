name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""
      dry-run:
        description: "Build and validate release packages without signing or publishing a GitHub release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only this job publishes the GitHub release, so only it gets write access.
    permissions:
      contents: write
      packages: write
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: ./.github/workflows/release-platforms.yml
    with:
      app-name: wordcraft
      app-title: Tom OS WordDocEdit
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      web-craft-fonts: true
      # workflow_dispatch provides these values; push events do not. Supply typed defaults
      # so the reusable workflow receives a string and boolean for either trigger.
      version: ${{ inputs.version || '' }}
      dry-run: ${{ inputs.dry-run || false }}
      publish: true
    secrets:
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
